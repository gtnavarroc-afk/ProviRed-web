<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <defs>
    <!-- Gradients for subtle depth matching brand identity -->
    <linearGradient id="yellowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFCE00"/>
      <stop offset="100%" stop-color="#F2A900"/>
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14418E"/>
      <stop offset="100%" stop-color="#082967"/>
    </linearGradient>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5232A"/>
      <stop offset="100%" stop-color="#B8141B"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Left Blue Swoosh -->
  <path d="M 28 42 C 45 42 62 50 82 75 C 65 105 52 145 74 165 C 63 150 48 118 42 85 C 38 65 32 52 28 42 Z" 
        fill="url(#blueGradient)" />
  
  <!-- Red Inner Swoosh Accent -->
  <path d="M 40 43 C 58 45 72 56 82 75 C 77 62 65 50 48 45 C 44 44 42 43 40 43 Z" 
        fill="url(#redGradient)" />
  
  <!-- Right Golden Yellow Swoosh -->
  <path d="M 125 15 C 105 45 92 85 108 120 C 114 135 110 152 74 165 C 100 150 115 125 110 95 C 105 65 115 35 125 15 Z" 
        fill="url(#yellowGradient)" filter="url(#softShadow)" />

  <!-- ProviRed Typography -->
  <text x="180" y="115" font-family="'Merriweather', 'Playfair Display', 'Georgia', serif" font-size="78" font-weight="700" fill="#1C2025" letter-spacing="-0.5">
    Provi<tspan font-weight="800" fill="#11161B">Red</tspan>
  </text>
  
  <!-- Subtle accent dot over 'i' in brand red / gold -->
  <circle cx="340.5" cy="56" r="6" fill="#1C2025"/>
</svg>
